---
name: Launcher

# Lint and test the launcher's Python package (launcher/, the jedimaster
# package) on the oldest Python it supports. The tests build their own
# mission files; no game data is used.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  # Every commit on main keeps its own result; a newer push to a pull
  # request replaces the run for the older one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Named so each step runs with -e and -o pipefail.
    shell: bash

jobs:
  launcher:
    name: Launcher package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11, the oldest the package supports
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the package with its test tools
        run: python -m pip install --disable-pip-version-check "./launcher[test]" "ruff==0.15.20"

      - name: Check the package's form
        run: |
          ruff format --check launcher
          ruff check launcher

      - name: Run the package's tests
        run: python -m pytest -q launcher/tests
