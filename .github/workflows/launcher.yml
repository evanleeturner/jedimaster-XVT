---
name: Launcher

# Lint and test the launcher's Python package (launcher/, the jedimaster
# package) on the oldest Python it supports, and build and test the
# launcher's web page (launcher/page/). The tests build their own game files
# (missions, and movies made with FFmpeg); no game data is used.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  # Every commit on main keeps its own result; a newer push to a pull
  # request replaces the run for the older one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Named so each step runs with -e and -o pipefail.
    shell: bash

jobs:
  launcher:
    name: Launcher package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11, the oldest the package supports
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install FFmpeg, which the movie reader runs
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Install the package with its test tools
        run: |
          python -m pip install --disable-pip-version-check \
            "./launcher[test,page,bot]" "ruff==0.15.20"

      - name: Check the package's form
        run: |
          ruff format --check launcher
          ruff check launcher

      - name: Run the package's tests
        run: python -m pytest -q launcher/tests

  page:
    name: Launcher page
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: launcher/page
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11, which runs the launcher the browser tests start
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: Install the launcher with its web server
        working-directory: .
        run: python -m pip install --disable-pip-version-check "./launcher[page]"

      - name: Install the page's tools from the lock file
        run: npm ci

      - name: Check the types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Check the form
        run: npm run format:check

      - name: Run the unit tests
        run: npm test

      - name: Check that the generated types match the schema
        run: |
          npm run gen:types
          git diff --exit-code -- src/generated

      - name: Build the page
        run: npm run build

      - name: Install the browser the tests drive
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run the browser tests
        run: npm run test:browser
