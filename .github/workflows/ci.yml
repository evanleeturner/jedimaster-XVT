name: Package CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux ${{ matrix.build-type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ github.event_name == 'push' && fromJSON('["Release", "Debug"]') || fromJSON('["Release"]') }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Determine short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Stage the AI program
        run: python3 ai/tools/stage_package.py build/ai-package

      - name: Build package
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: engine
          file: engine/packaging/linux/Dockerfile
          platforms: linux/amd64
          target: artifact
          build-contexts: |
            ai=build/ai-package
          build-args: |
            XVT_BUILD_TYPE=${{ matrix.build-type }}
            XVT_VERSION=${{ steps.sha.outputs.short }}
          outputs: type=local,dest=build/artifacts
          cache-from: type=gha,scope=linux
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=linux' || '' }}

      - name: Check the package carries the AI program
        run: |
          tar -tJf build/artifacts/*.tar.xz \
            | grep -E '^[^/]+/ai/jedimaster_ai/__main__[.]py$' > /dev/null

      - name: Check the package carries its notice and license texts
        run: |
          listing="$(tar -tJf build/artifacts/*.tar.xz)"
          for file in NOTICE.txt licenses/GPL-3.0.txt licenses/FFmpeg-LGPL-2.1.txt \
              licenses/libjuice.txt licenses/cjson.txt licenses/cgltf.txt; do
            grep -qxE "[^/]+/${file}" <<< "${listing}" || { echo "missing ${file}"; exit 1; }
          done
          # The notice names this commit's source.
          tar -xJOf build/artifacts/*.tar.xz --wildcards '*/NOTICE.txt' \
            | grep -qF "/jedimaster-XVT/tree/${{ steps.sha.outputs.short }}"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxvt-linux-x86_64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.tar.xz
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.build-type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ github.event_name == 'push' && fromJSON('["Release", "Debug"]') || fromJSON('["Release"]') }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Determine short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Stage the AI program
        run: python3 ai/tools/stage_package.py build/ai-package

      - name: Build package
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: engine
          file: engine/packaging/windows/Dockerfile
          platforms: linux/amd64
          target: artifact
          build-contexts: |
            ai=build/ai-package
          build-args: |
            XVT_BUILD_TYPE=${{ matrix.build-type }}
            XVT_VERSION=${{ steps.sha.outputs.short }}
          outputs: type=local,dest=build/artifacts
          cache-from: type=gha,scope=windows
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=windows' || '' }}

      - name: Check the package carries the AI program
        run: |
          unzip -Z1 build/artifacts/*.zip \
            | grep -E '^[^/]+/ai/jedimaster_ai/__main__[.]py$' > /dev/null

      - name: Check the package carries its notice and license texts
        run: |
          listing="$(unzip -Z1 build/artifacts/*.zip)"
          for file in NOTICE.txt licenses/GPL-3.0.txt licenses/FFmpeg-LGPL-2.1.txt \
              licenses/libjuice.txt licenses/cjson.txt licenses/cgltf.txt; do
            grep -qxE "[^/]+/${file}" <<< "${listing}" || { echo "missing ${file}"; exit 1; }
          done

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxvt-windows-x86_64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.build-type }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ github.event_name == 'push' && fromJSON('["Release", "Debug"]') || fromJSON('["Release"]') }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Determine short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: brew install cmake ninja pkg-config

      - name: Determine runner image version
        id: runner-image
        run: echo "version=${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency caches
        uses: actions/cache@v6
        with:
          path: |
            engine/build/cache/macos-arm64/sources
            engine/build/cache/macos-arm64/dependencies
            engine/build/cache/macos-arm64/tools
            engine/build/cache/macos-arm64/build/sdl
            engine/build/cache/macos-arm64/build/zstd
            engine/build/cache/macos-arm64/build/ffmpeg
            engine/build/cache/macos-arm64/build/shadercross
          key: macos-arm64-${{ steps.runner-image.outputs.version }}-deps-${{ hashFiles('engine/packaging/macos/build-package.sh', 'engine/packaging/common/shadercross-fsr3.patch') }}

      - name: Build package
        env:
          XVT_BUILD_TYPE: ${{ matrix.build-type }}
          XVT_VERSION: ${{ steps.sha.outputs.short }}
        run: ./engine/packaging/macos/build-package.sh

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxvt-macos-arm64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: engine/build/artifacts/*.dmg
          if-no-files-found: error
